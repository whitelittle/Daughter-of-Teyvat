<script type="text/plain" id="prelude">local cur = { size = 16 }
local function mkfont(a, b)
  local s = type(a) == "number" and a or (b or 16)
  return { size = s, getHeight = function() return math.floor(s * 1.25) end,
    getWidth = function(_, str) return _js_measure(tostring(str), s) end }
end
love = {
  graphics = {
    newFont = mkfont,
    setFont = function(f) cur = f end,
    setColor = function(r, g, b, a) _js_color(r, g, b, a or 1) end,
    rectangle = function(m, x, y, w, h, rx) _js_rect(m, x, y, w, h, rx or 0) end,
    circle = function(m, x, y, r) _js_circle(m, x, y, r) end,
    ellipse = function(m, x, y, rx, ry) _js_ellipse(m, x, y, rx, ry) end,
    polygon = function(m, ...) _js_poly(m, ...) end,
    line = function(...) _js_line(...) end,
    setLineWidth = function(w) _js_lw(w) end,
    print = function(s, x, y) _js_text(tostring(s), x, y, cur.size, -1, "left") end,
    printf = function(s, x, y, w, al) _js_text(tostring(s), x, y, cur.size, w, al or "left") end,
    clear = function(r, g, b) _js_clear(r, g, b) end,
    newImage = function(p)
      local id = p:match("^assets/(.+)%.%w+$")
      return { id = id,
        getWidth = function() local w = _js_imgsize(id); return w end,
        getHeight = function() local _, h = _js_imgsize(id); return h end }
    end,
    draw = function(im, x, y, r, sx, sy) _js_drawimg(im.id, x, y, sx or 1, sy or 1) end,
  },
  math = { random = function(a, b) if a then return math.random(a, b) end return math.random() end },
  mouse = { getPosition = function() return _js_mouse() end },
  filesystem = { getInfo = function(p)
    if p == "font.ttf" then return {} end
    local id = p:match("^assets/(.+)%.png$")
    if id and _js_hasimg(id) then return {} end
  end },
  window = { setTitle = function() end, setMode = function() end },
}
</script>

package.preload["core.ui"] = function(...)
-- 界面基础:颜色、字体、文字、按钮、占位框、弹窗、提示
local lg = love.graphics
local U = { W = 1280, H = 720, buttons = {}, mx = 0, my = 0, popup = nil, toastS = nil, toastT = 0 }

U.C = {
  wall = {0.55, 0.37, 0.19}, floor = {0.64, 0.46, 0.25}, window = {0.99, 0.85, 0.5},
  wood = {0.47, 0.3, 0.15}, woodD = {0.29, 0.17, 0.08}, woodL = {0.75, 0.53, 0.28},
  cream = {0.98, 0.93, 0.83}, creamD = {0.8, 0.74, 0.63}, ink = {0.26, 0.15, 0.07},
  light = {1, 0.96, 0.86}, mut = {0.66, 0.58, 0.47},
  orange = {0.94, 0.62, 0.22}, orangeD = {0.6, 0.45, 0.28}, gold = {0.98, 0.8, 0.36},
  red = {0.84, 0.3, 0.2}, pink = {0.96, 0.52, 0.47}, green = {0.4, 0.72, 0.42},
  greenL = {0.62, 0.86, 0.55}, yellow = {0.98, 0.86, 0.45}, blue = {0.3, 0.45, 0.8},
  night = {0.07, 0.08, 0.15}, black = {0, 0, 0},
}
local C = U.C

function U.init()
  local path
  for _, p in ipairs({ "font.ttf", "font.otf" }) do
    if love.filesystem.getInfo(p) then path = p end
  end
  local function f(sz)
    if path then return lg.newFont(path, sz) end
    return lg.newFont(math.floor(sz * 0.85))
  end
  U.fS, U.fM, U.fL, U.fXL = f(15), f(19), f(26), f(42)
  U.fontOK = path ~= nil
end

function U.setc(c, a) lg.setColor(c[1], c[2], c[3], a or 1) end
function U.box(c, x, y, w, h, r, mode, a)
  U.setc(c, a); lg.rectangle(mode or "fill", x, y, w, h, r or 8, r or 8)
end
function U.txt(s, x, y, c, f, w, al, a)
  lg.setFont(f or U.fM); U.setc(c or C.light, a)
  if w then lg.printf(s, x, y, w, al or "left") else lg.print(s, x, y) end
end
-- 深棕描边字(主界面风格)
function U.txtO(s, x, y, c, f, w, al)
  for _, d in ipairs({ { -2, 0 }, { 2, 0 }, { 0, -2 }, { 0, 2 }, { 0, 3 } }) do
    U.txt(s, x + d[1], y + d[2], C.woodD, f, w, al)
  end
  U.txt(s, x, y, c, f, w, al)
end

function U.hit(x, y, w, h) return U.mx >= x and U.mx <= x + w and U.my >= y and U.my <= y + h end
function U.zone(x, y, w, h, fn) U.buttons[#U.buttons + 1] = { x = x, y = y, w = w, h = h, fn = fn, enabled = true } end

function U.button(label, x, y, w, h, fn, enabled, sub)
  if enabled == nil then enabled = true end
  local hov = enabled and U.hit(x, y, w, h)
  U.box(C.woodD, x, y + 4, w, h, 12)
  U.box(enabled and (hov and C.gold or C.orange) or C.orangeD, x, y, w, h, 12)
  U.box(C.woodD, x, y, w, h, 12, "line")
  local ty = sub and (y + 6) or (y + h / 2 - U.fM:getHeight() / 2)
  U.txt(label, x, ty, enabled and C.ink or C.wood, U.fM, w, "center")
  if sub then U.txt(sub, x + 4, y + h - 22, C.ink, U.fS, w - 8, "center", 0.8) end
  U.buttons[#U.buttons + 1] = { x = x, y = y, w = w, h = h, fn = fn, enabled = enabled }
end

-- 场景里的漂浮热点(上方小字标收益)
function U.hotspot(label, tag, x, y, w, col, fn, enabled)
  local h = 44
  local hov = enabled and U.hit(x, y, w, h)
  U.box(C.woodD, x, y + 3, w, h, 22, "fill", 0.9)
  U.box(enabled and col or C.creamD, x, y, w, h, 22)
  if hov then lg.setLineWidth(3); U.box(C.light, x, y, w, h, 22, "line"); lg.setLineWidth(1) end
  U.txt(label, x, y + h / 2 - U.fM:getHeight() / 2, C.ink, U.fM, w, "center")
  if tag then U.txtO(tag, x, y - 22, C.light, U.fS, w, "center") end
  if enabled then U.zone(x, y, w, h, fn) end
end

function U.dashRect(x, y, w, h, c, a)
  U.setc(c, a); lg.setLineWidth(2)
  local function seg(x1, y1, x2, y2)
    local len = math.sqrt((x2 - x1) ^ 2 + (y2 - y1) ^ 2)
    local n = math.max(1, math.floor(len / 18))
    for i = 0, n - 1 do
      local t1, t2 = i / n, math.min(1, (i + 0.6) / n)
      lg.line(x1 + (x2 - x1) * t1, y1 + (y2 - y1) * t1, x1 + (x2 - x1) * t2, y1 + (y2 - y1) * t2)
    end
  end
  seg(x, y, x + w, y); seg(x + w, y, x + w, y + h); seg(x + w, y + h, x, y + h); seg(x, y + h, x, y)
  lg.setLineWidth(1)
end

-- 立绘/素材占位框:显示资源 ID,替换素材时按 ID 对应
function U.placeholder(id, desc, x, y, w, h)
  U.box(C.light, x, y, w, h, 18, "fill", 0.14)
  U.dashRect(x, y, w, h, C.light, 0.85)
  U.txtO("【立绘占位】", x, y + h / 2 - 46, C.light, U.fM, w, "center")
  U.txtO(id, x, y + h / 2 - 14, C.gold, U.fM, w, "center")
  if desc then U.txtO(desc, x + 14, y + h / 2 + 18, C.light, U.fS, w - 28, "center") end
end

-- 图片素材:assets/<素材ID>.png 或 .jpg,找不到时逐级去掉 ID 末段再找
-- 例:ist_child_happy → ist_child → ist,所以只放一张 ist.png 也能用
local cache = {}
local function find(id)
  if cache[id] then return cache[id] end
  for _, ext in ipairs({ ".png", ".jpg", ".jpeg" }) do
    local p = "assets/" .. id .. ext
    if love.filesystem.getInfo(p) then cache[id] = lg.newImage(p); return cache[id] end
  end
  return nil
end
function U.image(id)
  local s = id
  while s do
    local im = find(s)
    if im then return im end
    s = s:find("_") and s:match("^(.*)_[^_]*$") or nil
  end
  return nil
end

-- 立绘:有图就按框等比缩放、底部对齐;没图显示占位框
function U.portrait(id, desc, x, y, w, h)
  local im = U.image(id)
  if not im then U.placeholder(id, desc, x, y, w, h); return end
  local iw, ih = im:getWidth(), im:getHeight()
  local sc = math.min(w / iw, h / ih)
  lg.setColor(1, 1, 1, 1)
  lg.draw(im, x + (w - iw * sc) / 2, y + h - ih * sc, 0, sc, sc)
end

-- 背景:有图就铺满屏幕,返回 true
function U.background(id)
  local im = U.image(id)
  if not im then return false end
  local iw, ih = im:getWidth(), im:getHeight()
  local sc = math.max(U.W / iw, U.H / ih)
  lg.setColor(1, 1, 1, 1)
  lg.draw(im, (U.W - iw * sc) / 2, (U.H - ih * sc) / 2, 0, sc, sc)
  return true
end

function U.tag(s, x, y)
  lg.setFont(U.fS)
  local w = U.fS:getWidth(s) + 20
  U.box(C.black, x, y, w, 26, 6, "fill", 0.45)
  U.txt(s, x + 10, y + 4, C.light, U.fS)
end

-- 弹窗:一个或两个按钮;打开时屏蔽下层点击
function U.openPopup(title, body, btn, onOk, cancel)
  U.popup = { title = title, body = body, btn = btn or "继续", onOk = onOk, cancel = cancel }
end
function U.drawPopup()
  local p = U.popup
  if not p then return end
  U.box(C.black, 0, 0, U.W, U.H, 0, "fill", 0.5)
  U.zone(0, 0, U.W, U.H, function() end)
  local x, y, w, h = 330, 170, 620, 380
  U.box(C.woodD, x - 6, y - 6, w + 12, h + 12, 18)
  U.box(C.cream, x, y, w, h, 14)
  U.txt(p.title, x, y + 26, C.ink, U.fL, w, "center")
  U.txt(p.body, x + 40, y + 84, C.ink, U.fM, w - 80, "center")
  local function close(ok)
    U.popup = nil
    if ok and p.onOk then p.onOk() end
  end
  if p.cancel then
    U.button(p.cancel, x + 120, y + h - 80, 170, 56, function() close(false) end)
    U.button(p.btn, x + w - 290, y + h - 80, 170, 56, function() close(true) end)
  else
    U.button(p.btn, x + w / 2 - 100, y + h - 80, 200, 56, function() close(true) end)
  end
end

function U.toast(s) U.toastS, U.toastT = s, 2 end
function U.update(dt) if U.toastT > 0 then U.toastT = U.toastT - dt end end
function U.drawToast()
  if U.toastT <= 0 or not U.toastS then return end
  local a = math.min(1, U.toastT * 2)
  lg.setFont(U.fM)
  local w = math.min(1000, U.fM:getWidth(U.toastS) + 60)
  U.box(C.woodD, U.W / 2 - w / 2, 150, w, 50, 25, "fill", 0.9 * a)
  U.txt(U.toastS, U.W / 2 - w / 2, 164, C.light, U.fM, w, "center", a)
end

function U.beginFrame()
  U.buttons = {}
  U.mx, U.my = love.mouse.getPosition()
end
function U.click(x, y)
  U.mx, U.my = x, y
  for i = #U.buttons, 1, -1 do
    local b = U.buttons[i]
    if b.enabled and x >= b.x and x <= b.x + b.w and y >= b.y and y <= b.y + b.h then b.fn(); return end
  end
end

return U

end

package.preload["game.flow"] = function(...)
-- 月度流程:月初事件 → 主界面安排 → 月末结算
local S = require("game.state")
local R = require("core.router")
local story = require("data.story")
local F = {}

function F.newGame()
  S.new()
  R.go("dialogue", { script = story.opening, onDone = F.startMonth })
end

function F.startMonth()
  if F.isOver() then R.go("ending", { kind = "grown" }); return end
  for _, ev in ipairs(story.events) do
    if not S.flags["ev_" .. ev.id] and ev.when(S) then
      S.flags["ev_" .. ev.id] = true
      R.go("dialogue", { script = ev.script, onDone = function()
        if not F.checkFail() then R.go("home") end
      end })
      return
    end
  end
  R.go("home")
end

-- 月末:扣生活费、恢复心情、推进时间;返回结算说明
function F.endMonth()
  local res = S.apply({ mora = -S.CFG.livingCost, mood = S.CFG.moodRegen })
  S.month = S.month + 1
  if S.month > 12 then S.month, S.year = 1, S.year + 1 end
  S.ap, S.talked = S.CFG.apMax, false
  return res
end

function F.checkFail()
  if S.st.exp >= 100 then R.go("ending", { kind = "exposed" }); return true end
  return false
end

function F.isOver() return S.monthIndex() > S.CFG.totalMonths end

return F

end
package.preload["game.state"] = function(...)
-- 存档数据与数值规则(对应千星奇域里的全局变量)
local S = {}

S.NAME = { body = "体魄", wit = "智识", emo = "情感", imag = "想象",
  div = "神性", hum = "人性", exp = "暴露度", mood = "心情", mora = "摩拉" }
S.BASE = { "body", "wit", "emo", "imag" }
local ORDER = { "body", "wit", "emo", "imag", "div", "hum", "exp", "mood", "mora" }
local IS_BASE = { body = true, wit = true, emo = true, imag = true }
local CLAMP100 = { div = true, hum = true, exp = true, mood = true }

-- 评级门槛:E D C B A S
S.GRADES = { { 0, "E" }, { 30, "D" }, { 70, "C" }, { 120, "B" }, { 180, "A" }, { 250, "S" } }

S.CFG = {
  totalMonths = 36,   -- 三年,一回合一个月
  apMax = 13,         -- 每月行动力
  livingCost = 30,    -- 每月生活费
  moodRegen = 8,      -- 月末心情恢复
}

function S.new()
  S.year, S.month = 1, 1
  S.ap = S.CFG.apMax
  S.st = { body = 10, wit = 10, emo = 10, imag = 12, div = 30, hum = 20, exp = 0, mood = 80, mora = 300 }
  S.flags = {}
  S.talked = false
end

function S.monthIndex() return (S.year - 1) * 12 + S.month end
function S.monthsLeft() return S.CFG.totalMonths - S.monthIndex() + 1 end
function S.stage() return S.year == 1 and "幼年" or (S.year == 2 and "少年" or "青年") end
function S.stageKey() return S.year == 1 and "child" or (S.year == 2 and "teen" or "adult") end
function S.moodKey()
  local m = S.st.mood
  if m >= 70 then return "happy" elseif m >= 35 then return "calm" end
  return "sad"
end

function S.grade(v)
  local g, nxt = "E", nil
  for i, t in ipairs(S.GRADES) do
    if v >= t[1] then g = t[2]; nxt = S.GRADES[i + 1] and S.GRADES[i + 1][1] or nil end
  end
  return g, nxt
end

-- 心情影响成长:高心情 ×1.2,低心情 ×0.5
function S.moodMult()
  local m = S.st.mood
  if m >= 70 then return 1.2 elseif m < 30 then return 0.5 end
  return 1
end

-- 应用效果表,返回变化说明文字
function S.apply(eff)
  local out = {}
  for _, k in ipairs(ORDER) do
    local v = eff[k]
    if v and v ~= 0 then
      if IS_BASE[k] and v > 0 then v = math.max(1, math.floor(v * S.moodMult() + 0.5)) end
      local old = S.st[k]
      local nv = old + v
      if CLAMP100[k] then nv = math.max(0, math.min(100, nv))
      elseif k ~= "mora" then nv = math.max(0, nv) end
      S.st[k] = nv
      local d = nv - old
      if d ~= 0 then out[#out + 1] = S.NAME[k] .. (d > 0 and " +" or " ") .. d end
    end
  end
  return table.concat(out, "   ")
end

function S.canAfford(eff, ap)
  if S.ap < (ap or 0) then return false, "行动力不足" end
  if eff and eff.mora and eff.mora < 0 and S.st.mora < -eff.mora then return false, "摩拉不足" end
  return true
end

return S

end

  for i, k in ipairs(S.BASE) do
    local v = S.st[k]
    local g, nxt = S.grade(v)
    local ry = y + 44 + (i - 1) * 52
    U.box(C.cream, x + 16, ry, 316, 46, 8)
    U.box(C.woodL, x + 16, ry, 316, 46, 8, "line")
    U.txt(S.NAME[k], x + 26, ry + 12, STAT_COL[k], U.fM)
    U.txt(tostring(v), x + 80, ry + 6, C.ink, U.fL)
    if nxt then U.txt("还差 " .. (nxt - v), x + 160, ry + 15, C.mut, U.fS) end
    U.txt(g, x + 270, ry + 6, STAT_COL[k], U.fL, 50, "center")
  end
end

local function drawSchedule()
  U.box(C.black, 0, 0, U.W, U.H, 0, "fill", 0.5)
  U.zone(0, 0, U.W, U.H, function() end)
  local px, py, pw, ph = 120, 56, 1040, 616
  U.box(C.woodD, px - 6, py - 6, pw + 12, ph + 12, 18)
  U.box(C.cream, px, py, pw, ph, 14)
  U.txt("本月安排", px + 30, py + 20, C.ink, U.fL)
  U.txt("剩余行动力 " .. S.ap .. "    摩拉 " .. S.st.mora .. "    心情 " .. S.st.mood .. "(成长 ×" .. S.moodMult() .. ")",
    px + 190, py + 28, C.ink, U.fM)
  U.button("关闭", px + pw - 130, py + 16, 110, 46, function() H.sched = false end)
  for i, a in ipairs(ACT) do
    local col, row = (i - 1) % 3, math.floor((i - 1) / 3)
    local x, y, w, h = px + 30 + col * 330, py + 84 + row * 128, 310, 116
    local ok, why = S.canAfford(a.eff, a.ap)
    if a.unlock and S.year < a.unlock then ok, why = false, "第 " .. a.unlock .. " 年开放" end
    local hov = ok and U.hit(x, y, w, h)
    U.box(ok and (hov and C.yellow or C.light) or C.creamD, x, y, w, h, 10)
    U.box(C.woodL, x, y, w, h, 10, "line")
    U.box(C.orange, x + 10, y + 10, 64, 26, 13)
    U.txt(a.place, x + 10, y + 13, C.ink, U.fS, 64, "center")
    U.txt(a.name, x + 84, y + 10, C.ink, U.fM)
    local m = a.eff.mora
    U.txt("行动力 " .. a.ap .. (m and ("    摩拉 " .. (m > 0 and "+" or "") .. m) or ""), x + 12, y + 46, C.wood, U.fS)
    U.txt(preview(a.eff), x + 12, y + 70, C.ink, U.fS, w - 24)
    if not ok then U.txt(why, x, y + h - 24, C.red, U.fS, w - 12, "right") end
    if ok then
      U.zone(x, y, w, h, function()
        S.ap = S.ap - a.ap
        local ch = S.apply(a.eff)
        if F.checkFail() then H.sched = false; return end
        U.openPopup(a.place .. " · " .. a.name, a.say .. "\n\n" .. ch)
      end)
    end
  end
end

function H.draw()
  drawRoom()
  -- 女儿立绘(按年龄段 + 心情切换 ID)
  local id = "ist_" .. S.stageKey() .. "_" .. S.moodKey()
  U.portrait(id, A.portraits[id], 470, 150, 340, 570)
  U.zone(500, 160, 280, 520, talk)
  if not S.talked then U.txtO("点她聊天", 500, 640, C.light, U.fS, 280, "center") end

  local can = S.ap >= 1
  U.hotspot("读书", "+智识", 100, 330, 150, C.greenL, function() quick("读书", 1, { wit = 2, mood = -2 }) end, can)
  U.hotspot("陪她玩", "+情感 +心情", 100, 410, 150, C.yellow, function() quick("陪她玩", 1, { emo = 2, mood = 6 }) end, can)
  U.hotspot("藏起沙漏", "-暴露度", 840, 330, 160, C.creamD, function() quick("藏起沙漏", 1, { exp = -3, div = -1 }) end, can)
  U.hotspot("结束本月", "床", 1030, 372, 170, C.orange, endMonth, true)

  drawTop()
  drawStats()
  U.button("外出探险", 930, 648, 160, 62, function() end, false, "开发中")
  U.button("安排", 1106, 648, 160, 62, function() H.sched = true end)
  if H.sched then drawSchedule() end
end

return H

end

<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
<script>
(function(){
const errBox=document.getElementById('err');
function fail(m){errBox.style.display='block';errBox.textContent='运行出错:\n'+m;}
if(!window.fengari){fail('Lua 虚拟机(fengari-web)没有加载成功,请检查网络后刷新。');return;}
const {lua,lauxlib,lualib,to_luastring}=fengari;
const W=1280,H=720,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
const FONT='"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';
let mx=-1,my=-1;
const L=lauxlib.luaL_newstate();lualib.luaL_openlibs(L);
const num=i=>lua.lua_tonumber(L,i),str=i=>lua.lua_tojsstring(L,i),has=i=>lua.lua_type(L,i)>0;
function reg(n,f){lua.lua_pushjsfunction(L,f);lua.lua_setglobal(L,to_luastring(n));}
function paint(m){if(m==='line')ctx.stroke();else ctx.fill();}
reg('_js_color',()=>{const a=has(4)?num(4):1;const c=`rgba(${Math.round(num(1)*255)},${Math.round(num(2)*255)},${Math.round(num(3)*255)},${a})`;ctx.fillStyle=c;ctx.strokeStyle=c;return 0;});
reg('_js_rect',()=>{const x=num(2),y=num(3),w=num(4),h=num(5),r=num(6)||0;if(w<=0||h<=0)return 0;ctx.beginPath();
  if(ctx.roundRect&&r>0)ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2));else ctx.rect(x,y,w,h);paint(str(1));return 0;});
reg('_js_circle',()=>{ctx.beginPath();ctx.arc(num(2),num(3),Math.max(0,num(4)),0,Math.PI*2);paint(str(1));return 0;});
reg('_js_ellipse',()=>{ctx.beginPath();ctx.ellipse(num(2),num(3),Math.max(0,num(4)),Math.max(0,num(5)),0,0,Math.PI*2);paint(str(1));return 0;});
reg('_js_poly',()=>{const n=lua.lua_gettop(L);ctx.beginPath();ctx.moveTo(num(2),num(3));for(let i=4;i<n;i+=2)ctx.lineTo(num(i),num(i+1));ctx.closePath();paint(str(1));return 0;});
reg('_js_line',()=>{const n=lua.lua_gettop(L);ctx.beginPath();ctx.moveTo(num(1),num(2));for(let i=3;i<n;i+=2)ctx.lineTo(num(i),num(i+1));ctx.stroke();return 0;});
reg('_js_measure',()=>{ctx.font=num(2)+'px '+FONT;lua.lua_pushnumber(L,ctx.measureText(str(1)).width);return 1;});
const IMGS={};
reg('_js_hasimg',()=>{const im=IMGS[str(1)];lua.lua_pushboolean(L,!!(im&&im.complete&&im.naturalWidth>0));return 1;});
reg('_js_imgsize',()=>{const im=IMGS[str(1)];lua.lua_pushnumber(L,im?im.naturalWidth:1);lua.lua_pushnumber(L,im?im.naturalHeight:1);return 2;});
reg('_js_drawimg',()=>{const im=IMGS[str(1)];if(im&&im.complete)ctx.drawImage(im,num(2),num(3),im.naturalWidth*num(4),im.naturalHeight*num(5));return 0;});
const STATUS={};
const KNOWN=['bg_ruin_night','bg_home_room','bg_home_night','bg_sky_tianding'];
function showStatus(){document.getElementById('loaded').textContent=Object.keys(STATUS).map(k=>{const st=STATUS[k];
  if(st==='err')return k+' ✗读取失败';if(st==='load')return k+' …';
  return (k==='ist'||k.startsWith('ist_')||KNOWN.includes(k))?k+' ✓':k+' ⚠名字不对应任何素材ID';}).join('    ');}
document.getElementById('files').addEventListener('change',e=>{
  for(const f of e.target.files){const id=f.name.replace(/\.[^.]+$/,'').trim();STATUS[id]='load';
    const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{IMGS[id]=im;STATUS[id]='ok';showStatus();};im.onerror=()=>{STATUS[id]='err';showStatus();};im.src=rd.result;};
    rd.onerror=()=>{STATUS[id]='err';showStatus();};
    rd.readAsDataURL(f);}
  showStatus();e.target.value='';});
reg('_js_lw',()=>{ctx.lineWidth=num(1);return 0;});
reg('_js_clear',()=>{ctx.fillStyle=`rgb(${Math.round(num(1)*255)},${Math.round(num(2)*255)},${Math.round(num(3)*255)})`;ctx.fillRect(0,0,W,H);return 0;});
reg('_js_mouse',()=>{lua.lua_pushnumber(L,mx);lua.lua_pushnumber(L,my);return 2;});
reg('_js_text',()=>{const s=str(1),x=num(2),y=num(3),size=num(4),w=num(5),al=str(6);
  ctx.font=size+'px '+FONT;ctx.textBaseline='top';const lh=Math.floor(size*1.25),lines=[];
  for(const para of s.split('\n')){if(w<0){lines.push(para);continue;}let cur='';
    for(const ch of Array.from(para)){if(cur&&ctx.measureText(cur+ch).width>w){lines.push(cur);cur=ch;}else cur+=ch;}lines.push(cur);}
  lines.forEach((ln,i)=>{let dx=x;if(w>=0){const lw=ctx.measureText(ln).width;if(al==='center')dx=x+(w-lw)/2;else if(al==='right')dx=x+w-lw;}
    ctx.fillText(ln,dx,y+i*lh+size*0.1);});return 0;});
function run(code,name){const b=to_luastring(code);if(lauxlib.luaL_loadbuffer(L,b,b.length,to_luastring(name))!==lua.LUA_OK||lua.lua_pcall(L,0,0,0)!==lua.LUA_OK){fail(lua.lua_tojsstring(L,-1));return false;}return true;}
function call(name,args){lua.lua_getglobal(L,to_luastring('love'));lua.lua_getfield(L,-1,to_luastring(name));
  if(lua.lua_type(L,-1)!==lua.LUA_TFUNCTION){lua.lua_pop(L,2);return true;}
  for(const a of args||[]){if(typeof a==='number')lua.lua_pushnumber(L,a);else lua.lua_pushstring(L,to_luastring(a));}
  if(lua.lua_pcall(L,(args||[]).length,0,0)!==lua.LUA_OK){fail(lua.lua_tojsstring(L,-1));lua.lua_pop(L,2);return false;}
  lua.lua_pop(L,1);return true;}
function pos(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height;}
cv.addEventListener('pointermove',pos);
cv.addEventListener('pointerleave',()=>{mx=-1;my=-1;});
cv.addEventListener('pointerdown',e=>{pos(e);call('draw');call('mousepressed',[mx,my,1]);});
addEventListener('keydown',e=>{if(e.key==='Escape')call('keypressed',['escape']);});
lua.lua_pushstring(L,to_luastring(String(Date.now()%100000)));lua.lua_setglobal(L,to_luastring('_SEED'));
if(!run(document.getElementById('prelude').textContent+'\nmath.randomseed(tonumber(_SEED))','=prelude'))return;
if(!run(document.getElementById('mainlua').textContent,'=main.lua'))return;
if(!call('load'))return;
let last=performance.now(),ok=true;
function frame(t){if(!ok)return;const dt=Math.min(0.1,(t-last)/1000);last=t;ok=call('update',[dt])&&call('draw');if(ok)requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
